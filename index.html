<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello - SWY Lecture Note</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f8fafc;
  }
  .card {
    text-align: center;
    padding: 3rem 4rem;
    border-radius: 1rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }
  h1 {
    font-size: 2.5rem;
    margin: 0 0 0.5rem;
  }
  p {
    margin: 0;
    color: #94a3b8;
    font-size: 1.1rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>👋 Hello, SWY Lecture Note!</h1>
    <p>이 페이지는 배포 테스트를 위해 생성되었습니다.</p>
  </div>
</body>
</html>
