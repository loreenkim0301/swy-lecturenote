<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>내 문장 모음</title>
<style>
body{width:320px;margin:0;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f7f7f5;color:#1f1f1f}
header{padding:12px 14px;background:#1f1f1f;color:#fff;font-weight:700;font-size:14px;display:flex;justify-content:space-between}
header small{font-weight:400;opacity:.7}
ul{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto}
li{background:#fff;border:1px solid #e3e3df;border-radius:8px;padding:10px;cursor:pointer;font-size:13px;line-height:1.45}
li:hover{border-color:#1f1f1f}
li .from{display:block;margin-top:4px;font-size:11px;color:#777}
.empty{padding:20px;text-align:center;font-size:13px;color:#777}
#toast{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#1f1f1f;color:#fff;font-size:12px;padding:6px 12px;border-radius:20px;opacity:0;transition:.2s}
#toast.on{opacity:1}
</style></head>
<body>
<header>내 문장 모음 <small id="count"></small></header>
<ul id="list"></ul>
<div id="toast">복사했어요</div>
<script src="popup.js"></script>
</body></html>
