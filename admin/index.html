<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
<title>강사 전용 · 회차별 퀴즈</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{--ink:#172033;--muted:#657086;--line:#dfe4ed;--soft:#f5f7fb;--blue:#2457f5;--nav:#111a2e;--green:#16a36b;--red:#c0392b;--bg:#eef1f6;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
header.top{background:var(--nav);color:#fff;padding:20px 16px}
header.top .in,main{max-width:960px;margin:0 auto}
header.top p{margin:4px 0 0;color:#a9b4cc;font-size:13px}
header.top h1{margin:0;font-size:20px}
main{padding:24px 16px 80px}
.gate{max-width:420px;margin:48px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.gate label{display:block;font-weight:700;margin-bottom:8px}
.gate input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}
.gate button,.btn{margin-top:12px;padding:10px 14px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:700 14px inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:0}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:1.2em}
nav.days{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
nav.days a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;font-size:13px;font-weight:700}
section.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 24px;scroll-margin-top:12px}
section.day>header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
section.day h2{margin:0;font-size:19px}
section.day h2 a{font-size:13px;font-weight:600;margin-left:8px;color:var(--blue)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
article.qz{border-top:1px dashed var(--line);padding:14px 0}
article.qz:first-of-type{border-top:0}
article.qz h3{margin:0 0 8px;font-size:16px}
article.qz ol{margin:0 0 8px;padding-left:0;list-style:none}
article.qz li{margin:4px 0}
article.qz li.ok{font-weight:700}
details{background:var(--soft);border-radius:10px;padding:10px 14px;margin:8px 0}
summary{cursor:pointer;font-weight:700}
dl.ex{margin:8px 0 0}
dl.ex dt{font-weight:700;margin-top:6px}
dl.ex dt.ok{color:var(--green)}
dl.ex dt.no{color:var(--red)}
dl.ex dd{margin:0 0 0 0}
.qtools{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.note{font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="in"><h1>강사 전용 · 회차별 퀴즈와 해설</h1><p>SELECTWAY · AI 프로덕트 매니저 장기과정 · 학생에게 공유하지 마세요</p></div></header>
<main>
<form class="gate" id="gate" autocomplete="off">
<label for="pw">비밀번호</label>
<input id="pw" type="password" required>
<button type="submit">열기</button>
<p class="err" id="err" role="alert"></p>
<p class="note">비밀번호가 맞으면 이 브라우저 안에서만 내용을 풀어서 보여 줘요.</p>
</form>
<div id="app" hidden>
<p class="note">각 문제의 [문제 복사]는 학생용(보기까지), [정답·해설 복사]는 정답과 보기별 해설까지 복사해요. 보기 번호 ①~④는 복사한 글에도 그대로 들어가요.</p>

<div id="days"></div>
</div>

<script>
(function(){
var N=['①','②','③','④'];
function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
var P=JSON.parse(document.getElementById('payload').textContent);
async function unlock(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function qText(q,n){return 'Q'+n+'. '+q.q+'\n'+q.o.map(function(o,i){return N[i]+' '+o;}).join('\n');}
function aText(q,n){return qText(q,n)+'\n\n정답: '+N[q.a-1]+'\n해설\n'+q.e.map(function(e,i){return N[i]+' '+(i===q.a-1?'정답':'오답')+': '+e;}).join('\n');}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
var toast=document.getElementById('toast'),tt;
function copy(txt){
  var done=function(){toast.textContent='복사했어요';toast.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('on');},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallback(txt);done();});}else{fallback(txt);done();}
}
function fallback(txt){var a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(a);}
function btn(label,fn,ghost){var b=el('button','btn'+(ghost?' ghost':''),label);b.type='button';b.addEventListener('click',fn);return b;}
function render(data){
  var nav=document.getElementById('daynav'),wrap=document.getElementById('days');
  data.forEach(function(d){
    var a=el('a',null,d.short);a.href='#'+d.id;nav.appendChild(a);
    var s=el('section','day');s.id=d.id;s.setAttribute('aria-labelledby',d.id+'-h');
    var h=el('header'),h2=el('h2',null,d.label);h2.id=d.id+'-h';
    var lk=el('a',null,'교안 열기');lk.href=d.page;lk.target='_blank';lk.rel='noopener';h2.appendChild(lk);h.appendChild(h2);
    var tl=el('div','tools');
    tl.appendChild(btn('문제 전체 복사',function(){copy(d.label+'\n\n'+d.qs.map(function(q,i){return qText(q,i+1);}).join('\n\n'));},true));
    tl.appendChild(btn('정답·해설 전체 복사',function(){copy(d.label+' · 정답과 해설\n\n'+d.qs.map(function(q,i){return aText(q,i+1);}).join('\n\n'));}));
    h.appendChild(tl);s.appendChild(h);
    d.qs.forEach(function(q,i){
      var ar=el('article','qz');ar.appendChild(el('h3',null,'Q'+(i+1)+'. '+q.q));
      var ol=el('ol');q.o.forEach(function(o,j){var li=el('li',null,N[j]+' '+o);ol.appendChild(li);});ar.appendChild(ol);
      var det=el('details'),sm=el('summary',null,'정답과 해설 보기');det.appendChild(sm);
      det.appendChild(el('p',null,'정답: '+N[q.a-1]+' '+q.o[q.a-1]));
      var dl=el('dl','ex');q.e.forEach(function(e,j){var ok=j===q.a-1;dl.appendChild(el('dt',ok?'ok':'no',N[j]+' '+(ok?'정답':'오답')));dl.appendChild(el('dd',null,e));});
      det.appendChild(dl);ar.appendChild(det);
      var qt=el('div','qtools');qt.appendChild(btn('문제 복사',function(){copy(qText(q,i+1));},true));qt.appendChild(btn('정답·해설 복사',function(){copy(aText(q,i+1));},true));
      ar.appendChild(qt);s.appendChild(ar);
    });
    wrap.appendChild(s);
  });
}
document.getElementById('gate').addEventListener('submit',function(ev){
  ev.preventDefault();var err=document.getElementById('err');err.textContent='여는 중…';
  unlock(document.getElementById('pw').value).then(function(data){
    document.getElementById('gate').hidden=true;document.getElementById('app').hidden=false;render(data);err.textContent='';
  },function(){err.textContent='비밀번호가 맞지 않아요.';});
});
})();
</script>
